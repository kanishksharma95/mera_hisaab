services:
  - type: web
    name: mera-hisaab
    env: python
    branch: dev
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mera-hisaab-db
          property: connectionString
      # Shared cache for rate-limit + axes counters across gunicorn workers.
      # If this service is removed, the app falls back to in-memory cache.
      - key: REDIS_URL
        fromService:
          type: redis
          name: mera-hisaab-redis
          property: connectionString

  # Free Redis (Key Value) instance — internal connections only.
  - type: redis
    name: mera-hisaab-redis
    plan: free
    ipAllowList: []

databases:
  - name: mera-hisaab-db
    databaseName: mera_hisaab
    user: mera_hisaab
    plan: free
