services:
  - type: web
    name: mera-hisaab
    env: python
    branch: dev
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY --timeout 120"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mera-hisaab-db
          property: connectionString
      # Shared cache for rate-limit + axes counters across gunicorn workers.
      # If this service is removed, the app falls back to in-memory cache.
      - key: REDIS_URL
        fromService:
          type: redis
          name: mera-hisaab-redis
          property: connectionString
      # Force Postgres in prod (never silently fall back to SQLite).
      - key: USE_SQLITE
        value: "0"
      # --- Email ---
      # PREFERRED on Render: Brevo over HTTPS. Render's free tier blocks
      # outbound SMTP ports (25/465/587), so the Gmail SMTP vars below will
      # time out here — set BREVO_API_KEY and the app uses Brevo instead.
      # --- Gmail SMTP (non-secret config; used only if BREVO_API_KEY unset) ---
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      # --- Secrets: set these values in the Render dashboard (sync: false
      #     keeps them OUT of git; blueprint only declares that they exist).
      #     DEFAULT_FROM_EMAIL must equal your verified Brevo sender address. ---
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # --- Optional: Cloudflare R2 media storage (leave unset to use local FS) ---
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_CUSTOM_DOMAIN
        sync: false

  # Free Redis (Key Value) instance — internal connections only.
  - type: redis
    name: mera-hisaab-redis
    plan: free
    ipAllowList: []

databases:
  - name: mera-hisaab-db
    databaseName: mera_hisaab
    user: mera_hisaab
    plan: free
