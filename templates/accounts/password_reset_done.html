{% extends "layouts/auth_base.html" %}
{% load i18n %}
{% block title %}{% trans "Email sent" %}{% endblock %}
{% block auth_content %}
<h5 class="mb-3">{% trans "Check your email" %}</h5>
<p class="text-muted">{% trans "If an account exists for that email, a password reset link has been sent." %}</p>
<a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary w-100">{% trans "Back to login" %}</a>
{% endblock %}
