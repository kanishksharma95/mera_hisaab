{% load static i18n %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %} · {{ APP_NAME }}</title>
  <meta name="description" content="{{ APP_TAGLINE }}">
  <meta name="theme-color" content="#0f766e">

  {# No-flash theme: apply the saved theme before the page paints. #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mh-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- PWA & Mobile Installability -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/icon.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon.svg' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Self-hosted vendor CSS -->
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  <!-- Toasts (Django messages are surfaced here) -->
  {% include "components/toasts.html" %}

  <!-- Self-hosted vendor JS -->
  <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/static/sw.js').catch(function() {});
      });
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
